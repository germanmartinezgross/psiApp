<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PsiApp – Gestión de Pacientes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <a class="nav-brand" href="#/">🧠 PsiApp</a>
    <div class="nav-links">
      <a href="#/" class="nav-link" data-page="inicio">Inicio</a>
      <a href="#/pacientes" class="nav-link" data-page="pacientes">Pacientes</a>
      <a href="#/calendario" class="nav-link" data-page="calendario">Calendario</a>
    </div>
    <div class="nav-export">
      <a href="https://chatgpt.com" target="_blank" class="btn btn-outline btn-sm" title="Abrir ChatGPT">
        🤖 ChatGPT
      </a>
      <button class="btn btn-outline btn-sm" id="btn-exportar" onclick="modalExportar()">
        ⬇ Exportar
      </button>
      <button class="btn btn-outline btn-sm" id="btn-drive-desconectar"
        onclick="desconectarDrive()" style="display:none">
        ☁️✕ Desconectar Drive
      </button>
      <button class="btn btn-outline btn-sm" id="btn-cerrar-servidor"
        onclick="confirmarCerrarServidor()" title="Cerrar la aplicación">
        ✕ Cerrar app
      </button>
    </div>
  </nav>

  <main id="app">
    <div class="loading-initial">Cargando...</div>
  </main>

  <!-- Modal global -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="handleOverlayClick(event)">
    <div class="modal" id="modal-box">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" id="modal-confirm">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
